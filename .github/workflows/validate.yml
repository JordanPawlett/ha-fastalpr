name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions: {}
jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  dependency-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install inference dependency on Home Assistant's Python version
        run: python -m pip install 'fast-alpr[onnx]==0.4.0'
      - name: Verify CPU ONNX runtime and load pretrained models
        run: |
          python - <<'PY'
          import onnxruntime as ort
          from fast_alpr import ALPR
          assert 'CPUExecutionProvider' in ort.get_available_providers()
          ALPR(
              detector_model='yolo-v9-t-384-license-plate-end2end',
              ocr_model='cct-s-v2-global-model',
          )
          print('FastALPR models initialised with CPU ONNX')
          PY
  backend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build supervised Debian inference app
        run: docker build -t fastalpr-inference-test ./fastalpr_backend
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest aiohttp
      - run: python -m compileall -q custom_components fastalpr_backend
      - run: python -m pytest -q tests
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [hacs, hassfest, dependency-smoke, backend-image, unit-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Release validated integration version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c 'import json; print(json.load(open("custom_components/fast_alpr/manifest.json"))["version"])')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "FastALPR $version" --generate-notes
          fi

